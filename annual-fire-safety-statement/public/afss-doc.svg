<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafaf9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#paper)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1200" height="200" fill="#111111"/>
  <rect x="0" y="200" width="1200" height="10" fill="#fb5614"/>
  <text x="80" y="80" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#fb5614" letter-spacing="3">ANNUAL FIRE SAFETY STATEMENT</text>
  <text x="80" y="140" font-family="Inter, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">AFSS · 2026 assessment</text>
  <text x="80" y="178" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="2">For the year ending 31 December 2026</text>

  <!-- Section 1 -->
  <g transform="translate(80, 260)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#fb5614" letter-spacing="3">01</text>
    <text x="36" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#111111" letter-spacing="3">BUILDING DETAILS</text>
    <rect x="0" y="14" width="1040" height="120" fill="#fafaf9" stroke="#e7e5e4"/>

    <text x="20" y="50" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="2">PROPERTY</text>
    <text x="20" y="80" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#111111">Strata Plan 12345</text>
    <text x="20" y="110" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#4a4a46">123 Example Street, Sydney NSW 2000</text>

    <line x1="380" y1="14" x2="380" y2="134" stroke="#e7e5e4"/>

    <text x="400" y="50" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="2">USE</text>
    <text x="400" y="80" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#111111">Mixed-use residential</text>
    <text x="400" y="110" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#4a4a46">12 storeys · 84 apartments</text>

    <line x1="780" y1="14" x2="780" y2="134" stroke="#e7e5e4"/>

    <text x="800" y="50" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="2">OWNER</text>
    <text x="800" y="80" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#111111">Owners Corporation</text>
    <text x="800" y="110" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#4a4a46">Strata managing agent on file</text>
  </g>

  <!-- Section 2 -->
  <g transform="translate(80, 420)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#fb5614" letter-spacing="3">02</text>
    <text x="36" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#111111" letter-spacing="3">FIRE SAFETY SCHEDULE</text>
    <text x="0" y="22" font-family="Inter, sans-serif" font-size="13" fill="#6b7280">Version dated 14 March 2022 · lodged with Council</text>

    <rect x="0" y="50" width="1040" height="50" fill="#111111"/>
    <text x="20" y="82" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="2">#</text>
    <text x="60" y="82" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="2">MEASURE</text>
    <text x="500" y="82" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="2">STANDARD</text>
    <text x="780" y="82" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="2">ASSESSED</text>

    <g font-family="Inter, sans-serif" font-size="14" fill="#111111">
      <rect x="0" y="100" width="1040" height="60" fill="#fafaf9"/>
      <line x1="0" y1="160" x2="1040" y2="160" stroke="#e7e5e4"/>
      <text x="20" y="138" font-weight="700">01</text>
      <text x="60" y="138" font-weight="700">Fire detection &amp; alarm system</text>
      <text x="500" y="138" fill="#6b7280">AS 1670.1</text>
      <circle cx="800" cy="131" r="11" fill="#16a34a"/>
      <path d="M 795 131 L 798 134 L 805 126" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>

      <rect x="0" y="160" width="1040" height="60" fill="#ffffff"/>
      <line x1="0" y1="220" x2="1040" y2="220" stroke="#e7e5e4"/>
      <text x="20" y="198" font-weight="700">02</text>
      <text x="60" y="198" font-weight="700">Sprinkler system</text>
      <text x="500" y="198" fill="#6b7280">AS 2118.1</text>
      <circle cx="800" cy="191" r="11" fill="#16a34a"/>
      <path d="M 795 191 L 798 194 L 805 186" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>

      <rect x="0" y="220" width="1040" height="60" fill="#fafaf9"/>
      <line x1="0" y1="280" x2="1040" y2="280" stroke="#e7e5e4"/>
      <text x="20" y="258" font-weight="700">03</text>
      <text x="60" y="258" font-weight="700">Fire hydrant system</text>
      <text x="500" y="258" fill="#6b7280">AS 2419.1</text>
      <circle cx="800" cy="251" r="11" fill="#16a34a"/>
      <path d="M 795 251 L 798 254 L 805 246" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>

      <rect x="0" y="280" width="1040" height="60" fill="#ffffff"/>
      <line x1="0" y1="340" x2="1040" y2="340" stroke="#e7e5e4"/>
      <text x="20" y="318" font-weight="700">04</text>
      <text x="60" y="318" font-weight="700">Fire doors (including -/120/30)</text>
      <text x="500" y="318" fill="#6b7280">AS 1905.1</text>
      <circle cx="800" cy="311" r="11" fill="#ca8a04"/>
      <text x="800" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#ffffff">!</text>

      <rect x="0" y="340" width="1040" height="60" fill="#fafaf9"/>
      <line x1="0" y1="400" x2="1040" y2="400" stroke="#e7e5e4"/>
      <text x="20" y="378" font-weight="700">05</text>
      <text x="60" y="378" font-weight="700">Emergency lighting</text>
      <text x="500" y="378" fill="#6b7280">AS 2293.1</text>
      <circle cx="800" cy="371" r="11" fill="#16a34a"/>
      <path d="M 795 371 L 798 374 L 805 366" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Section 3 -->
  <g transform="translate(80, 870)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#fb5614" letter-spacing="3">03</text>
    <text x="36" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#111111" letter-spacing="3">PRACTITIONER DETAILS</text>

    <rect x="0" y="20" width="1040" height="180" fill="#fafaf9" stroke="#e7e5e4"/>

    <!-- APFS badge -->
    <g transform="translate(40, 50)">
      <rect x="0" y="0" width="120" height="120" fill="#fef3c7"/>
      <rect x="0" y="0" width="120" height="120" fill="#000000" opacity="0.06"/>
      <text x="60" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="900" fill="#111111" letter-spacing="3">APFS</text>
      <line x1="20" y1="55" x2="100" y2="55" stroke="#111111" stroke-width="1"/>
      <text x="60" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#111111" letter-spacing="2">FIRE SAFETY</text>
      <text x="60" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#44403c">ACCREDITED</text>
      <text x="60" y="106" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#44403c">PRACTITIONER</text>
    </g>

    <text x="200" y="60" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="2">NAME</text>
    <text x="200" y="86" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#111111">Practitioner</text>

    <text x="200" y="120" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="2">ACCREDITATION No.</text>
    <text x="200" y="146" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#111111">APFS — recorded on issued AFSS</text>

    <text x="200" y="180" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="2">SCOPE OF ASSESSMENT</text>
    <text x="200" y="200" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#4a4a46">As listed in the table above. Scope verified by accreditation category.</text>
  </g>

  <!-- Section 4 -->
  <g transform="translate(80, 1110)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#fb5614" letter-spacing="3">04</text>
    <text x="36" y="0" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#111111" letter-spacing="3">OWNER DECLARATION</text>

    <rect x="0" y="20" width="1040" height="180" fill="#fafaf9" stroke="#e7e5e4"/>

    <text x="20" y="60" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#111111" line-height="1.5">
      <tspan x="20" dy="0">I, the building owner, acknowledge that the essential fire safety measures listed</tspan>
      <tspan x="20" dy="22">above have been assessed in accordance with the Building &amp; Development</tspan>
      <tspan x="20" dy="22">Certifiers Regulation 2020. I understand the assessment does not certify that the</tspan>
      <tspan x="20" dy="22">building is free from defects, and that routine service under AS 1851-2012 remains</tspan>
      <tspan x="20" dy="22">a separate obligation on the owner.</tspan>
    </text>

    <line x1="20" y1="180" x2="500" y2="180" stroke="#111111" stroke-width="2"/>
    <text x="20" y="200" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="2">OWNER SIGNATURE</text>
    <text x="20" y="218" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#111111">Date: _________</text>
  </g>

  <!-- Stamp -->
  <g transform="translate(900, 1110) rotate(-12 0 0)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#fb5614" stroke-width="5"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#fb5614" stroke-width="2"/>
    <text x="0" y="-12" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#fb5614" letter-spacing="2">ASSESSED</text>
    <text x="0" y="14" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="900" fill="#fb5614" letter-spacing="3">APFS</text>
    <text x="0" y="36" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#fb5614">2026 · NSW</text>
  </g>

  <!-- Footer -->
  <line x1="80" y1="1400" x2="1120" y2="1400" stroke="#e7e5e4"/>
  <text x="80" y="1430" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#6b7280" letter-spacing="2">SAMPLE — REFERENCE ONLY</text>
  <text x="80" y="1455" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#111111">Issued AFSS will include the practitioner and owner signatures, dates, and accreditation scope.</text>
</svg>
