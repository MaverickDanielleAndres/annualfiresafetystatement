<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f4"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fb5614" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fb5614" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Floating phone -->
  <g transform="translate(720, 200) rotate(8)">
    <ellipse cx="160" cy="500" rx="200" ry="40" fill="#000000" opacity="0.1"/>
    <rect x="0" y="0" width="320" height="520" rx="40" fill="url(#phone)"/>
    <rect x="20" y="20" width="280" height="480" rx="24" fill="#0a0e1a"/>
    <!-- Screen content -->
    <rect x="40" y="40" width="240" height="440" rx="14" fill="#111111"/>
    <!-- Status -->
    <rect x="40" y="40" width="240" height="40" rx="14" fill="#1f2937"/>
    <text x="160" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#fb5614" letter-spacing="2">CALLING</text>

    <!-- Big phone icon -->
    <g transform="translate(160, 200)">
      <circle cx="0" cy="0" r="50" fill="#fb5614"/>
      <path d="M -16 -18 Q -16 -24 -10 -24 L -2 -24 Q 4 -24 6 -16 L 8 -10 Q 8 -4 2 0 L 0 4 Q 4 14 14 18 L 18 16 Q 22 10 28 10 L 34 12 Q 42 14 42 20 L 42 28 Q 42 34 36 34 Q 6 34 -16 12 Q -16 -10 -16 -18 Z" fill="#ffffff"/>
    </g>

    <text x="160" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="0">1300 765 594</text>
    <text x="160" y="318" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#9ca3af" letter-spacing="2">NSW FIRE SAFETY</text>

    <!-- Buttons row -->
    <g transform="translate(40, 360)">
      <rect x="0" y="0" width="60" height="60" rx="14" fill="#1f2937"/>
      <rect x="74" y="0" width="60" height="60" rx="14" fill="#1f2937"/>
      <rect x="148" y="0" width="60" height="60" rx="14" fill="#1f2937"/>
    </g>

    <!-- Home bar -->
    <rect x="120" y="490" width="80" height="4" rx="2" fill="#9ca3af"/>
  </g>

  <!-- Behind the phone — abstract shapes -->
  <circle cx="900" cy="180" r="240" fill="url(#glow)"/>
  <circle cx="1080" cy="780" r="160" fill="url(#glow)"/>

  <!-- Foreground card -->
  <g transform="translate(140, 620)">
    <rect x="0" y="0" width="320" height="120" rx="14" fill="#ffffff"/>
    <rect x="0" y="0" width="320" height="120" rx="14" fill="#000000" opacity="0.05"/>
    <text x="20" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#d64114" letter-spacing="2">RESPONDS WITHIN</text>
    <text x="20" y="86" font-family="Inter, sans-serif" font-size="44" font-weight="900" fill="#111111" letter-spacing="-2">1 business day</text>
  </g>

  <!-- Haze -->
  <rect x="0" y="0" width="500" height="900" fill="url(#haze)" opacity="0.55"/>
</svg>
