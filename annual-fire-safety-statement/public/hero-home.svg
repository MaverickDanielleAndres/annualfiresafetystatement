  <!-- Technician silhouette — slightly off-right -->
  <g transform="translate(740, 380)">
    <!-- Body / hi-vis -->
    <path d="M -10 320
             L -10 200
             Q -10 180 10 175
             L 100 175
             Q 120 180 120 200
             L 120 320
             Z"
          fill="url(#hi-vis)"/>
    <!-- Reflective stripes -->
    <rect x="-10" y="240" width="130" height="6" fill="#fef3c7" opacity="0.85"/>
    <rect x="-10" y="252" width="130" height="3" fill="#fef3c7" opacity="0.6"/>
    <!-- Chest pocket detail -->
    <rect x="22" y="200" width="36" height="40" fill="#ea580c" opacity="0.55"/>
    <text x="40" y="226" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="0.5">AFSS</text>
    <!-- Head -->
    <circle cx="55" cy="140" r="38" fill="#f5d0a9"/>
    <!-- Hard hat -->
    <path d="M 10 130 Q 10 90 55 90 Q 100 90 100 130 Z" fill="#fbbf24"/>
    <rect x="10" y="128" width="90" height="10" fill="#f59e0b"/>
    <!-- Hat brim -->
    <rect x="-2" y="129" width="114" height="6" fill="#d97706"/>
    <!-- Eyes (subtle) -->
    <circle cx="44" cy="140" r="2.5" fill="#1f2937"/>
    <circle cx="66" cy="140" r="2.5" fill="#1f2937"/>
    <!-- Arm holding tablet -->
    <path d="M 90 220 L 145 250 L 155 240 L 100 200 Z" fill="url(#hi-vis)"/>
    <!-- Tablet -->
    <rect x="130" y="230" width="100" height="68" rx="6" fill="url(#tablet)"/>
    <rect x="138" y="240" width="84" height="48" rx="2" fill="#f1f5f9"/>
    <rect x="144" y="246" width="50" height="4" fill="#fb5614"/>
    <rect x="144" y="256" width="72" height="3" fill="#94a3b8"/>
    <rect x="144" y="264" width="60" height="3" fill="#94a3b8"/>
    <rect x="144" y="272" width="68" height="3" fill="#94a3b8"/>
    <rect x="144" y="280" width="40" height="3" fill="#94a3b8"/>
    <!-- Other arm -->
