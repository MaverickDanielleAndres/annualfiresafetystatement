<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafaf9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>

  <!-- Background: fire panel -->
  <rect x="60" y="60" width="200" height="280" fill="#1f2937"/>
  <rect x="60" y="60" width="200" height="280" fill="#000000" opacity="0.3"/>
  <rect x="80" y="80" width="160" height="40" fill="#fb5614"/>
  <text x="160" y="106" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="3">FIP</text>
  <g fill="#10b981">
    <circle cx="100" cy="160" r="6"/>
    <circle cx="140" cy="160" r="6"/>
    <circle cx="180" cy="160" r="6"/>
    <circle cx="220" cy="160" r="6"/>
  </g>
  <g fill="#fef3c7" opacity="0.5">
    <rect x="80" y="200" width="160" height="2"/>
    <rect x="80" y="220" width="160" height="2"/>
    <rect x="80" y="240" width="160" height="2"/>
  </g>

  <!-- Clipboard -->
  <g transform="translate(290, 90) rotate(8 100 140)">
    <rect x="0" y="0" width="220" height="320" rx="4" fill="url(#paper)"/>
    <rect x="0" y="0" width="220" height="320" rx="4" fill="#000000" opacity="0.05"/>
    <rect x="80" y="-14" width="60" height="22" rx="3" fill="#4b5563"/>
    <rect x="20" y="30" width="180" height="220" fill="#fafaf9"/>
    <text x="110" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#111111" letter-spacing="2">ASSESSMENT</text>
    <rect x="20" y="265" width="180" height="40" fill="#111111"/>

    <g fill="#fb5614">
      <rect x="30" y="50" width="60" height="3"/>
      <rect x="30" y="60" width="100" height="3"/>
      <rect x="30" y="70" width="80" height="3"/>
      <rect x="30" y="90" width="60" height="3"/>
      <rect x="30" y="100" width="120" height="3"/>
      <rect x="30" y="110" width="90" height="3"/>
      <rect x="30" y="130" width="60" height="3"/>
      <rect x="30" y="140" width="100" height="3"/>
      <rect x="30" y="150" width="80" height="3"/>
      <rect x="30" y="170" width="60" height="3"/>
      <rect x="30" y="180" width="120" height="3"/>
      <rect x="30" y="190" width="100" height="3"/>
      <rect x="30" y="210" width="60" height="3"/>
      <rect x="30" y="220" width="80" height="3"/>
    </g>

    <g transform="translate(150, 245)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#fb5614" stroke-width="3"/>
      <text x="0" y="-3" text-anchor="middle" font-family="Inter, sans-serif" font-size="6" font-weight="800" fill="#fb5614" letter-spacing="2">APFS</text>
      <text x="0" y="9" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="900" fill="#fb5614">2026</text>
    </g>
  </g>
</svg>
