<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="hi-vis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>

  <!-- Cabinet -->
  <rect x="60" y="100" width="180" height="280" rx="6" fill="#7f1d1d"/>
  <rect x="60" y="100" width="180" height="280" rx="6" fill="#000000" opacity="0.2"/>
  <rect x="80" y="140" width="140" height="160" fill="#0f172a" opacity="0.6"/>
  <rect x="80" y="140" width="140" height="160" fill="#fef3c7" opacity="0.2"/>

  <!-- Extinguisher inside -->
  <g transform="translate(110, 170)">
    <rect x="0" y="0" width="50" height="120" rx="6" fill="#fb5614"/>
    <rect x="-2" y="-14" width="54" height="14" rx="2" fill="#1f2937"/>
    <rect x="20" y="-32" width="10" height="20" fill="#1f2937"/>
    <rect x="10" y="42" width="30" height="14" fill="#fef3c7"/>
  </g>

  <!-- Technician -->
  <g transform="translate(280, 170)">
    <path d="M 0 250 L 0 130 Q 0 110 20 105 L 200 105 Q 220 110 220 130 L 220 250 Z" fill="url(#hi-vis)"/>
    <rect x="0" y="170" width="220" height="6" fill="#fef3c7" opacity="0.85"/>
    <rect x="0" y="184" width="220" height="3" fill="#fef3c7" opacity="0.55"/>

    <circle cx="110" cy="60" r="50" fill="#e8b795"/>
    <path d="M 50 50 Q 50 0 110 0 Q 170 0 170 50 Z" fill="#fef3c7"/>
    <rect x="50" y="48" width="120" height="10" fill="#fde047"/>
    <rect x="45" y="50" width="130" height="8" fill="#facc15"/>

    <rect x="0" y="250" width="100" height="40" fill="#1e3a8a"/>
    <rect x="120" y="250" width="100" height="40" fill="#1e3a8a"/>
  </g>

  <!-- Tools -->
  <g transform="translate(440, 380)">
    <rect x="0" y="0" width="100" height="40" rx="4" fill="#1f2937"/>
    <rect x="10" y="8" width="20" height="24" fill="#9ca3af"/>
    <rect x="40" y="8" width="20" height="24" fill="#9ca3af"/>
    <rect x="70" y="8" width="20" height="24" fill="#fbbf24"/>
  </g>
</svg>
