<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#sky)"/>
  <rect x="0" y="600" width="600" height="150" fill="#334155"/>

  <!-- Warehouse -->
  <rect x="40" y="240" width="520" height="360" fill="url(#metal)"/>
  <rect x="40" y="240" width="520" height="360" fill="#000000" opacity="0.15"/>

  <!-- Roof line -->
  <polygon points="20,240 100,180 480,180 580,240" fill="#1f2937"/>
  <polygon points="20,240 100,180 480,180 580,240" fill="#000000" opacity="0.2"/>

  <!-- Roof ridge -->
  <rect x="100" y="180" width="380" height="14" fill="#0f172a"/>

  <!-- Vertical ridges -->
  <g fill="#1f2937" opacity="0.45">
    <rect x="120" y="194" width="2" height="46"/>
    <rect x="180" y="194" width="2" height="46"/>
    <rect x="240" y="194" width="2" height="46"/>
    <rect x="300" y="194" width="2" height="46"/>
    <rect x="360" y="194" width="2" height="46"/>
    <rect x="420" y="194" width="2" height="46"/>
  </g>

  <!-- Roller doors -->
  <g>
    <rect x="80" y="380" width="130" height="220" fill="#1f2937"/>
    <rect x="80" y="380" width="130" height="220" fill="#000000" opacity="0.3"/>
    <g fill="#475569">
      <rect x="80" y="380" width="130" height="6"/>
      <rect x="80" y="410" width="130" height="6"/>
      <rect x="80" y="440" width="130" height="6"/>
      <rect x="80" y="470" width="130" height="6"/>
      <rect x="80" y="500" width="130" height="6"/>
      <rect x="80" y="530" width="130" height="6"/>
      <rect x="80" y="560" width="130" height="6"/>
      <rect x="80" y="590" width="130" height="6"/>
    </g>

    <rect x="230" y="380" width="150" height="220" fill="#1f2937"/>
    <rect x="230" y="380" width="150" height="220" fill="#000000" opacity="0.3"/>
    <g fill="#475569">
      <rect x="230" y="380" width="150" height="6"/>
      <rect x="230" y="410" width="150" height="6"/>
      <rect x="230" y="440" width="150" height="6"/>
      <rect x="230" y="470" width="150" height="6"/>
      <rect x="230" y="500" width="150" height="6"/>
      <rect x="230" y="530" width="150" height="6"/>
      <rect x="230" y="560" width="150" height="6"/>
      <rect x="230" y="590" width="150" height="6"/>
    </g>

    <rect x="400" y="420" width="80" height="100" fill="#0f172a"/>
    <rect x="400" y="420" width="80" height="100" fill="#fb5614" opacity="0.4"/>
  </g>

  <!-- Windows high -->
  <g fill="#fef3c7" opacity="0.7">
    <rect x="120" y="320" width="60" height="36"/>
    <rect x="200" y="320" width="60" height="36"/>
    <rect x="280" y="320" width="60" height="36"/>
    <rect x="360" y="320" width="60" height="36"/>
    <rect x="440" y="320" width="60" height="36"/>
  </g>

  <!-- Signage -->
  <rect x="80" y="260" width="220" height="36" fill="#fb5614"/>
  <text x="190" y="284" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="3">WAREHOUSE 04</text>
</svg>
