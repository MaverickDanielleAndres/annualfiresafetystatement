<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#sky)"/>
  <rect x="0" y="600" width="600" height="150" fill="#0f172a"/>

  <!-- Office tower -->
  <rect x="120" y="80" width="360" height="540" fill="url(#glass)"/>
  <rect x="120" y="80" width="360" height="540" fill="#000000" opacity="0.2"/>

  <!-- Glass curtain wall pattern -->
  <g>
    <g fill="#1e293b">
      <rect x="120" y="80" width="60" height="540"/>
      <rect x="240" y="80" width="60" height="540"/>
      <rect x="360" y="80" width="60" height="540"/>
      <rect x="480" y="80" width="60" height="540"/>
    </g>
    <g fill="#475569">
      <rect x="180" y="80" width="60" height="540"/>
      <rect x="300" y="80" width="60" height="540"/>
      <rect x="420" y="80" width="60" height="540"/>
    </g>
  </g>

  <!-- Horizontal bands -->
  <g fill="#0f172a">
    <rect x="120" y="130" width="420" height="4"/>
    <rect x="120" y="180" width="420" height="4"/>
    <rect x="120" y="230" width="420" height="4"/>
    <rect x="120" y="280" width="420" height="4"/>
    <rect x="120" y="330" width="420" height="4"/>
    <rect x="120" y="380" width="420" height="4"/>
    <rect x="120" y="430" width="420" height="4"/>
    <rect x="120" y="480" width="420" height="4"/>
    <rect x="120" y="530" width="420" height="4"/>
    <rect x="120" y="580" width="420" height="4"/>
  </g>

  <!-- Lit windows -->
  <g fill="#fbbf24" opacity="0.85">
    <rect x="140" y="200" width="40" height="14"/>
    <rect x="200" y="240" width="40" height="14"/>
    <rect x="260" y="200" width="40" height="14"/>
    <rect x="320" y="240" width="40" height="14"/>
    <rect x="380" y="200" width="40" height="14"/>
    <rect x="440" y="240" width="40" height="14"/>
    <rect x="140" y="350" width="40" height="14"/>
    <rect x="200" y="390" width="40" height="14"/>
    <rect x="260" y="350" width="40" height="14"/>
    <rect x="320" y="390" width="40" height="14"/>
    <rect x="380" y="350" width="40" height="14"/>
    <rect x="440" y="390" width="40" height="14"/>
    <rect x="140" y="500" width="40" height="14"/>
    <rect x="200" y="540" width="40" height="14"/>
    <rect x="260" y="500" width="40" height="14"/>
    <rect x="320" y="540" width="40" height="14"/>
    <rect x="380" y="500" width="40" height="14"/>
    <rect x="440" y="540" width="40" height="14"/>
  </g>

  <!-- Awning / entrance -->
  <rect x="240" y="620" width="120" height="20" fill="#fb5614"/>
  <rect x="260" y="640" width="80" height="80" fill="#020617"/>
  <rect x="260" y="640" width="80" height="80" fill="#fb5614" opacity="0.2"/>
</svg>
