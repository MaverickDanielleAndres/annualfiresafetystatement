<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f4"/>
      <stop offset="100%" stop-color="#d6d3d1"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8a29e"/>
      <stop offset="100%" stop-color="#57534e"/>
    </linearGradient>
    <linearGradient id="redEq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb5614"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="cabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Wall -->
  <rect width="1200" height="900" fill="url(#wall)"/>
  <!-- Floor -->
  <rect x="0" y="700" width="1200" height="200" fill="url(#floor)"/>
  <!-- Floor seam -->
  <line x1="0" y1="700" x2="1200" y2="700" stroke="#78716c" stroke-width="2" opacity="0.6"/>

  <!-- Exit sign -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="120" height="40" rx="3" fill="#16a34a"/>
    <rect x="0" y="0" width="120" height="40" rx="3" fill="#15803d" opacity="0.3"/>
    <text x="60" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="2">EXIT</text>
    <!-- Arrow -->
    <polygon points="98,12 110,20 98,28" fill="#ffffff"/>
    <rect x="84" y="18" width="14" height="4" fill="#ffffff"/>
  </g>

  <!-- Fire door (left) -->
  <g transform="translate(200, 220)">
    <rect x="0" y="0" width="180" height="500" fill="url(#door)"/>
    <rect x="0" y="0" width="180" height="500" fill="#000000" opacity="0.1"/>
    <rect x="6" y="6" width="168" height="488" fill="none" stroke="#1c1917" stroke-width="2" opacity="0.4"/>
    <!-- Push bar -->
    <rect x="14" y="300" width="152" height="10" rx="4" fill="#f5f5f4"/>
    <rect x="14" y="300" width="152" height="10" rx="4" fill="#000000" opacity="0.2"/>
    <!-- Fire rated label -->
    <rect x="40" y="60" width="100" height="80" rx="3" fill="#fef3c7"/>
    <text x="90" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#111111" letter-spacing="1">FIRE DOOR</text>
    <text x="90" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#111111">-/120/30</text>
    <text x="90" y="126" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#44403c">AS 1905.1</text>
  </g>

  <!-- Fire extinguisher cabinet -->
  <g transform="translate(440, 280)">
    <rect x="0" y="0" width="160" height="380" rx="6" fill="url(#cabinet)"/>
    <rect x="6" y="6" width="148" height="368" rx="3" fill="none" stroke="#fafafa" stroke-width="1" opacity="0.4"/>
    <!-- Glass window -->
    <rect x="20" y="40" width="120" height="180" rx="2" fill="#0f172a" opacity="0.55"/>
    <rect x="20" y="40" width="120" height="180" rx="2" fill="#fef3c7" opacity="0.15"/>
    <!-- Extinguisher inside -->
    <g transform="translate(35, 90)">
      <rect x="0" y="0" width="40" height="100" rx="6" fill="url(#redEq)"/>
      <rect x="-3" y="-12" width="46" height="14" rx="2" fill="#1f2937"/>
      <rect x="14" y="-30" width="12" height="22" fill="#1f2937"/>
      <rect x="10" y="-32" width="20" height="6" fill="#1f2937"/>
      <rect x="6" y="38" width="28" height="14" fill="#fef3c7"/>
    </g>
    <!-- Label -->
    <rect x="15" y="240" width="130" height="40" rx="3" fill="#fef3c7"/>
    <text x="80" y="266" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#111111" letter-spacing="1">EXTINGUISHER</text>
    <rect x="15" y="290" width="130" height="40" rx="3" fill="#fef3c7"/>
    <text x="80" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#111111" letter-spacing="1">HOSE REEL</text>
  </g>

  <!-- Sprinkler head + pipe -->
  <g transform="translate(680, 0)">
    <rect x="0" y="0" width="600" height="60" fill="#e7e5e4"/>
    <rect x="0" y="50" width="600" height="14" fill="#fb5614"/>
    <rect x="0" y="50" width="600" height="14" fill="#000000" opacity="0.15"/>
    <rect x="0" y="64" width="600" height="6" fill="#c2410c"/>
    <g transform="translate(200, 64)">
      <rect x="0" y="0" width="6" height="60" fill="#c2410c"/>
      <rect x="-12" y="55" width="30" height="20" fill="#1f2937"/>
      <rect x="-12" y="70" width="30" height="6" fill="#fbbf24"/>
    </g>
    <g transform="translate(360, 64)">
      <rect x="0" y="0" width="6" height="80" fill="#c2410c"/>
      <rect x="-12" y="75" width="30" height="20" fill="#1f2937"/>
      <rect x="-12" y="90" width="30" height="6" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Emergency light -->
  <g transform="translate(720, 200)">
    <rect x="0" y="0" width="180" height="120" rx="6" fill="#27272a"/>
    <rect x="10" y="20" width="160" height="70" fill="url(#light)"/>
    <rect x="10" y="20" width="160" height="70" fill="#fef3c7" opacity="0.7"/>
    <rect x="0" y="0" width="180" height="14" fill="#0f172a"/>
    <text x="90" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#111111" letter-spacing="2">EMERGENCY</text>
  </g>
  <ellipse cx="810" cy="430" rx="320" ry="180" fill="url(#glow)" opacity="0.5"/>

  <!-- Detector on ceiling -->
  <g transform="translate(990, 110)">
    <circle cx="0" cy="0" r="46" fill="#fef3c7"/>
    <circle cx="0" cy="0" r="46" fill="#000000" opacity="0.1"/>
    <circle cx="0" cy="0" r="22" fill="#1f2937"/>
    <circle cx="0" cy="0" r="14" fill="#374151"/>
    <circle cx="-6" cy="-6" r="6" fill="#6b7280"/>
  </g>

  <!-- Hazard fade on left -->
  <rect x="0" y="0" width="500" height="900" fill="url(#haze)" opacity="0.55"/>
</svg>
