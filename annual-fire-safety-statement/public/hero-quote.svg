<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fafaf9"/>
    </linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#warm)"/>

  <!-- Clipboard -->
  <g transform="translate(640, 130) rotate(4 200 350)">
    <!-- Shadow -->
    <ellipse cx="220" cy="720" rx="280" ry="22" fill="#000000" opacity="0.12"/>
    <!-- Clipboard -->
    <rect x="0" y="0" width="440" height="660" rx="6" fill="url(#clip)"/>
    <rect x="20" y="20" width="400" height="620" rx="2" fill="url(#paper)"/>
    <!-- Clip at top -->
    <rect x="160" y="-30" width="120" height="60" rx="6" fill="#4b5563"/>
    <rect x="180" y="-20" width="80" height="40" rx="4" fill="#9ca3af"/>
    <rect x="180" y="-20" width="80" height="40" rx="4" fill="#000000" opacity="0.15"/>

    <!-- Document content -->
    <text x="40" y="60" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#111111" letter-spacing="2">QUOTE REQUEST</text>
    <rect x="40" y="70" width="80" height="3" fill="#fb5614"/>

    <!-- Form fields -->
    <g transform="translate(40, 100)">
      <text x="0" y="0" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#6b7280" letter-spacing="2">BUILDING ADDRESS</text>
      <rect x="0" y="10" width="360" height="34" rx="4" fill="#f5f5f4"/>
      <rect x="0" y="10" width="200" height="6" rx="3" fill="#9ca3af"/>

      <text x="0" y="70" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#6b7280" letter-spacing="2">BUILDING TYPE</text>
      <rect x="0" y="80" width="360" height="34" rx="4" fill="#f5f5f4"/>
      <rect x="0" y="80" width="140" height="6" rx="3" fill="#9ca3af"/>

      <text x="0" y="140" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#6b7280" letter-spacing="2">FIRE SAFETY SCHEDULE</text>
      <rect x="0" y="150" width="360" height="34" rx="4" fill="#f5f5f4"/>
      <rect x="0" y="150" width="180" height="6" rx="3" fill="#9ca3af"/>

      <text x="0" y="210" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#6b7280" letter-spacing="2">AFSS DUE DATE</text>
      <rect x="0" y="220" width="170" height="34" rx="4" fill="#f5f5f4"/>
      <rect x="0" y="220" width="80" height="6" rx="3" fill="#9ca3af"/>

      <text x="190" y="210" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#6b7280" letter-spacing="2">ATTACH FILES</text>
      <rect x="190" y="220" width="170" height="34" rx="4" fill="#fff7f3" stroke="#fb5614" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="275" y="241" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#fb5614">+ Schedule</text>
    </g>

    <!-- Sticky note -->
    <g transform="translate(60, 460) rotate(-3 80 60)">
      <rect x="0" y="0" width="160" height="120" fill="#fde047"/>
      <rect x="0" y="0" width="160" height="120" fill="#000000" opacity="0.06"/>
      <text x="14" y="32" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#111111" letter-spacing="2">NEXT STEPS</text>
      <line x1="14" y1="46" x2="60" y2="46" stroke="#111111" stroke-width="1"/>
      <text x="14" y="68" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#111111">1. Review Schedule</text>
      <text x="14" y="84" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#111111">2. Site visit</text>
      <text x="14" y="100" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#111111">3. Quote</text>
    </g>
  </g>

  <!-- Haze -->
  <rect x="0" y="0" width="500" height="900" fill="url(#haze)" opacity="0.55"/>
</svg>
